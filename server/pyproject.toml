[project]
name = "ingpro"
version = "0.1.0"
description = "ingpro — local AI English coach (server)"
authors = [
    { name = "Eren", email = "63192807+erencatak@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "fsrs>=6.3.2",
    "kokoro>=0.9.4",
    "mlx-audio>=0.5.6",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "piper-tts>=1.8.0",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "spacy>=3.8.16",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ingpro = "ingpro:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["tests"]
